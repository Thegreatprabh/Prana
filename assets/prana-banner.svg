<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
<defs>
<radialGradient id="breath" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#00e5ff" stop-opacity="0.35"/>
<stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
</radialGradient>
<linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#00ff41" stop-opacity="0"/>
<stop offset="50%" stop-color="#00ff41" stop-opacity="0.22"/>
<stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
</linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="#14202f" stroke-width="1"/>
</pattern>
</defs>

<rect width="1200" height="400" fill="#0a0e14"/>
<rect width="1200" height="400" fill="url(#grid)"/>

<!-- HUD corner brackets -->
<g stroke="#00ff41" stroke-width="2" opacity="0.35" fill="none">
<path d="M24 64 V24 H64"/><path d="M1136 24 H1176 V64"/>
<path d="M24 336 V376 H64"/><path d="M1136 376 H1176 V336"/>
</g>

<!-- breathing glow -->
<circle cx="600" cy="140" r="170" fill="url(#breath)">
<animate attributeName="r" values="155;190;155" dur="4s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0.8;1;0.8" dur="4s" repeatCount="indefinite"/>
</circle>

<!-- lungs: breathing lobes -->
<g transform="translate(600,140)">
<g>
<animateTransform attributeName="transform" type="scale" values="1;1.07;1" dur="4s" repeatCount="indefinite"/>
<ellipse cx="-42" cy="0" rx="40" ry="68" fill="none" stroke="#00e5ff" stroke-width="3" opacity="0.95"/>
<ellipse cx="42" cy="0" rx="40" ry="68" fill="none" stroke="#00e5ff" stroke-width="3" opacity="0.95"/>
<line x1="0" y1="-68" x2="0" y2="-8" stroke="#00e5ff" stroke-width="3" opacity="0.95"/>
<!-- bronchi detail -->
<path d="M-42 0 q 20 12 42 0" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.5"/>
<path d="M42 0 q -20 12 -42 0" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.5" transform="translate(84,0)"/>
<!-- pulse dot travelling down the trachea -->
<circle r="4" fill="#00ff41">
<animateMotion dur="2s" repeatCount="indefinite" path="M0,-68 L0,-8"/>
<animate attributeName="opacity" values="1;1;0" dur="2s" repeatCount="indefinite"/>
</circle>
</g>
</g>

<!-- PRANA glitch title -->
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="bold" font-size="88" text-anchor="middle" letter-spacing="20">
<text x="608" y="316" fill="#00e5ff" opacity="0">PRANA
<animate attributeName="opacity" values="0;0;0.75;0;0;0.75;0" keyTimes="0;0.68;0.71;0.76;0.84;0.87;1" dur="3.4s" repeatCount="indefinite"/>
</text>
<text x="592" y="316" fill="#ff2e63" opacity="0">PRANA
<animate attributeName="opacity" values="0;0;0.75;0;0;0.75;0" keyTimes="0;0.68;0.72;0.77;0.84;0.88;1" dur="3.4s" repeatCount="indefinite"/>
</text>
<text x="600" y="316" fill="#e6edf3">PRANA</text>
</g>

<!-- tagline -->
<text x="600" y="356" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#00ff41" letter-spacing="4">give any chatbot a life.</text>

<!-- scanline sweep -->
<rect x="0" y="0" width="1200" height="26" fill="url(#scan)">
<animate attributeName="y" values="-30;400;-30" dur="5s" repeatCount="indefinite"/>
</rect>

<!-- vignette border -->
<rect width="1200" height="400" fill="none" stroke="#00ff41" stroke-width="2" opacity="0.22"/>
</svg>
